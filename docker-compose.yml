# BridgeBox AI Workforce Intelligence — single-host deployment.
#   cp .env.example .env   # fill DATABASE_URL (see below), AUTH_SECRET, AUTH_URL, VAULT_KEY, CRON_SECRET
#   docker compose up -d --build
#   docker compose run --rm migrate       # first time and after every upgrade
#   docker compose run --rm migrate npm run db:seed   # optional synthetic demo data
#   docker compose --profile n8n up -d    # optional: self-hosted n8n runtime
#
# Inside the compose network DATABASE_URL must point at the `db` service:
#   DATABASE_URL=postgresql://bridgebox:bridgebox@db:5432/bridgebox
# Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front of :3000. See docs/DEPLOYMENT.md §B.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bridgebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridgebox}
      POSTGRES_DB: ${POSTGRES_DB:-bridgebox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridgebox} -d ${POSTGRES_DB:-bridgebox}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host by default. Uncomment for local psql access:
    # ports: ["5432:5432"]

  migrate:
    build: .
    image: bridgebox-app
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bridgebox:bridgebox@db:5432/bridgebox}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    profiles: ["tools"]

  app:
    build: .
    image: bridgebox-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bridgebox:bridgebox@db:5432/bridgebox}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "start"]

  worker:
    build: .
    image: bridgebox-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bridgebox:bridgebox@db:5432/bridgebox}
      NODE_ENV: production
      WORKER_POLL_MS: ${WORKER_POLL_MS:-5000}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "worker"]

  # Optional self-hosted n8n (agent runtime). Set N8N_BASE_URL=http://n8n:5678 and N8N_API_KEY (create it in
  # n8n → Settings → API) in .env, or configure it per client under /app/settings/integrations.
  n8n:
    image: n8nio/n8n:1.80.5
    restart: unless-stopped
    profiles: ["n8n"]
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-America/Chicago}
      # Set N8N_ENCRYPTION_KEY in .env (openssl rand -hex 24) before first start; the placeholder is intentionally
      # not a required-variable check so that `docker compose up` without the n8n profile keeps working.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-me-openssl-rand-hex-24}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
